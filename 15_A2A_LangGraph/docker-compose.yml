# Docker Compose for LangGraph A2A Agent System
# Provides easy deployment and configuration management

version: '3.8'

services:
  # Main A2A Agent Server
  a2a-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: langgraph-a2a-agent
    restart: unless-stopped
    ports:
      - "10000:10000"
    environment:
      # Required: OpenAI API configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TOOL_LLM_NAME=${TOOL_LLM_NAME:-gpt-4o-mini}
      - TOOL_LLM_URL=${TOOL_LLM_URL:-https://api.openai.com/v1}
      
      # Optional: Tavily for web search
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      
      # Optional: RAG configuration
      - RAG_DATA_DIR=${RAG_DATA_DIR:-data}
      
      # Server configuration
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      # Mount data directory for RAG documents
      - ./data:/app/data:ro
      # Optional: Mount logs directory for persistence
      - ./logs:/app/logs
    networks:
      - a2a-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/.well-known/agent-card.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Nginx reverse proxy for production deployment
  nginx:
    image: nginx:alpine
    container_name: langgraph-a2a-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Uncomment for SSL certificates
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - a2a-agent
    networks:
      - a2a-network
    profiles:
      - production

networks:
  a2a-network:
    driver: bridge
    name: langgraph-a2a-network

volumes:
  # Optional: Persistent storage for logs
  agent-logs:
    driver: local
